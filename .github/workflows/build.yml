name: Build Jelly Browser APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build debug APK
      run: |
        set -o pipefail
        ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

    - name: Report build errors
      if: failure()
      run: |
        msg=$(grep -E -A3 'error:|ERROR|FAILED|What went wrong' build.log | head -c 3500 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
        echo "::error title=Build errors::$msg"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jelly-browser-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
